
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner Stok Barang</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  margin: 0;
  padding: 16px;
  color: #172033;
}

main {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #00000012;
}

h2 {
  text-align: center;
  color: #1761bd;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 16px;
  border: none;
  border-radius: 9px;
  background: #1761bd;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#reader {
  margin-top: 18px;
  width: 100%;
}

#status {
  margin-top: 15px;
  padding: 14px;
  background: #edf2f8;
  border-radius: 9px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.note {
  color: #596579;
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>
<main>

<h2>SCAN BARCODE STOK</h2>

<label>Jenis Transaksi</label>
<select id="jenis">
  <option value="MASUK">Barang Masuk</option>
  <option value="KELUAR">Barang Keluar</option>
</select>

<label>Jumlah Barang</label>
<input id="jumlah" type="number" min="1" step="1" value="1">

<label>Nama Petugas</label>
<input id="petugas" type="text" placeholder="Masukkan nama petugas">

<label>Catatan</label>
<input id="catatan" type="text" placeholder="Catatan (opsional)">

<button id="startBtn" onclick="mulaiScan()">
MULAI SCAN KAMERA
</button>

<button id="stopBtn" onclick="berhentiScan()" disabled>
HENTIKAN KAMERA
</button>

<div id="reader"></div>

<div id="status">
Scanner siap digunakan.
</div>

<p class="note">
Pastikan barcode sudah terdaftar di tab Master Barang.
Setiap hasil scan yang berhasil akan dicatat ke Google Sheets.
</p>

</main>

<script>
const API =
"https://script.google.com/macros/s/AKfycbwqA_JeellXGocrfo17T5bKqCc8SHWAf4Fg42HVPnGmiIS5j6vn_i26nq1vwuZDP4B_Rw/exec";

let scanner = null;
let sedangProses = false;
let nomorCallback = 0;

function tampilStatus(pesan) {
  document.getElementById("status").textContent = pesan;
}

async function mulaiScan() {
  if (scanner) return;

  if (typeof Html5Qrcode === "undefined") {
    tampilStatus("Library scanner gagal dimuat. Periksa internet.");
    return;
  }

  scanner = new Html5Qrcode("reader");

  document.getElementById("startBtn").disabled = true;
  document.getElementById("stopBtn").disabled = false;

  try {
    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 10,
        qrbox: { width: 250, height: 180 }
      },
      async function(barcode) {
        if (sedangProses) return;

        sedangProses = true;

        try {
          await scanner.pause(true);
          await kirimTransaksi(barcode);
        } finally {
          sedangProses = false;

          if (scanner) {
            try {
              scanner.resume();
            } catch (e) {}
          }
        }
      },
      function() {}
    );

    tampilStatus("Kamera aktif. Arahkan ke barcode barang.");

  } catch (err) {
    scanner = null;
    document.getElementById("startBtn").disabled = false;
    document.getElementById("stopBtn").disabled = true;

    tampilStatus(
      "Kamera gagal dibuka: " +
      (err.message || String(err))
    );
  }
}

async function berhentiScan() {
  if (scanner) {
    try {
      await scanner.stop();
      scanner.clear();
    } catch (e) {}

    scanner = null;
  }

  document.getElementById("startBtn").disabled = false;
  document.getElementById("stopBtn").disabled = true;

  tampilStatus("Kamera dihentikan.");
}

function kirimJSONP(parameter) {
  return new Promise(function(resolve, reject) {
    const callback =
      "hasilScannerStok" + (++nomorCallback);

    const script = document.createElement("script");
    let selesai = false;

    const timer = setTimeout(function() {
      if (selesai) return;
      selesai = true;
      bersihkan();

      reject(new Error(
        "Server tidak merespons. Periksa deployment Apps Script."
      ));
    }, 20000);

    function bersihkan() {
      clearTimeout(timer);
      script.remove();

      try {
        delete window[callback];
      } catch (e) {
        window[callback] = undefined;
      }
    }

    window[callback] = function(data) {
      if (selesai) return;
      selesai = true;
      bersihkan();
      resolve(data);
    };

    const query = new URLSearchParams({
      ...parameter,
      callback: callback,
      waktu: Date.now().toString()
    });

    script.onerror = function() {
      if (selesai) return;
      selesai = true;
      bersihkan();

      reject(new Error(
        "Gagal menghubungi Google Apps Script."
      ));
    };

    script.src =
      API + "?action=record&" + query.toString();

    document.body.appendChild(script);
  });
}

async function kirimTransaksi(barcode) {
  const jenis =
    document.getElementById("jenis").value;

  const jumlah =
    document.getElementById("jumlah").value;

  const petugas =
    document.getElementById("petugas").value.trim();

  const catatan =
    document.getElementById("catatan").value.trim();

  if (!jumlah || Number(jumlah) <= 0) {
    tampilStatus("Jumlah harus lebih dari 0.");
    return;
  }

  if (!petugas) {
    tampilStatus("Isi nama petugas terlebih dahulu.");
    return;
  }

  tampilStatus(
    "Barcode terbaca: " + barcode +
    "\nMengirim transaksi ke Google Sheets..."
  );

  try {
    const hasil = await kirimJSONP({
      barcode: barcode,
      jenis: jenis,
      jumlah: jumlah,
      petugas: petugas,
      catatan: catatan
    });

    if (hasil && hasil.ok) {
      tampilStatus(
        "TRANSAKSI BERHASIL!\n\n" +
        "Nama barang: " + hasil.nama +
        "\nKode barang: " + hasil.kode +
        "\nJenis: " + hasil.jenis +
        "\nJumlah: " + hasil.jumlah +
        "\n\nSilakan scan barang berikutnya."
      );
    } else {
      tampilStatus(
        "TRANSAKSI GAGAL:\n" +
        (hasil && hasil.error
          ? hasil.error
          : "Respons server tidak dikenali.")
      );
    }

  } catch (err) {
    tampilStatus("ERROR:\n" + err.message);
  }
}
</script>

</body>
</html>
