<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Stok Barang</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f4f9;
  margin: 0;
  padding: 16px;
  color: #172033;
}

main {
  max-width: 500px;
  margin: 20px auto;
  background: white;
  padding: 22px;
  border-radius: 16px;
  box-shadow: 0 4px 15px #00000012;
}

h2 {
  text-align: center;
  color: #1761bd;
}

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  margin-top: 7px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 16px;
  border: none;
  border-radius: 9px;
  background: #1761bd;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

#status {
  margin-top: 15px;
  padding: 14px;
  background: #edf2f8;
  border-radius: 9px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

#stokInfo {
  margin-top: 10px;
  padding: 12px;
  background: #edf6ff;
  border-radius: 8px;
  color: #1761bd;
  font-weight: bold;
}

.note {
  color: #596579;
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>
<main>

<h2>INPUT STOK BARANG</h2>

<label>Jenis Transaksi</label>
<select id="jenis">
  <option value="MASUK">Barang Masuk</option>
  <option value="KELUAR">Barang Keluar</option>
</select>

<label>Cari Barang</label>
<input
  type="text"
  id="cariBarang"
  placeholder="Ketik nama atau kode barang..."
  oninput="cariBarang()"
>

<label>Pilih Barang</label>
<select id="barang">
  <option value="">Memuat daftar barang...</option>
</select>

<div id="stokInfo">
  Pilih barang untuk melihat stok.
</div>

<label>Jumlah Barang</label>
<input id="jumlah" type="number" min="1" step="1" value="1">

<label>Nama Petugas</label>
<input id="petugas" type="text" placeholder="Masukkan nama petugas">

<label>Catatan</label>
<input id="catatan" type="text" placeholder="Catatan (opsional)">

<button id="simpanBtn" onclick="simpanTransaksi()">
SIMPAN TRANSAKSI
</button>

<button onclick="muatBarang()">
MUAT ULANG DAFTAR BARANG
</button>

<div id="status">
Menghubungkan ke Google Sheets...
</div>

<p class="note">
Pilih barang dari daftar. Transaksi akan otomatis dicatat ke Google Sheets.
Tidak perlu menggunakan kamera atau scan barcode.
</p>

</main>

<script>function cariBarang() {
  const kata = document
    .getElementById("cariBarang")
    .value.toLowerCase()
    .trim();

  const pilihan = document.getElementById("barang");

  const hasil = daftarBarang.filter(function(item) {
    return (
      item.nama.toLowerCase().includes(kata) ||
      item.kode.toLowerCase().includes(kata) ||
      item.barcode.toLowerCase().includes(kata)
    );
  });

  pilihan.innerHTML =
    '<option value="">-- Pilih Barang --</option>';

  hasil.forEach(function(item) {
    const option = document.createElement("option");
    option.value = item.barcode;
    option.textContent =
      item.nama + " | Kode: " + item.kode +
      " | Stok: " + item.stok;

    pilihan.appendChild(option);
  });

  tampilkanStok();
}
const API =
"https://script.google.com/macros/s/AKfycbwqA_JeellXGocrfo17T5bKqCc8SHWAf4Fg42HVPnGmiIS5j6vn_i26nq1vwuZDP4B_Rw/exec";

let daftarBarang = [];
let nomorCallback = 0;

function tampilStatus(pesan) {
  document.getElementById("status").textContent = pesan;
}

function kirimJSONP(parameter) {
  return new Promise(function(resolve, reject) {
    const callback = "hasilStok" + (++nomorCallback);
    const script = document.createElement("script");
    let selesai = false;

    const timer = setTimeout(function() {
      if (selesai) return;
      selesai = true;
      bersihkan();
      reject(new Error("Server tidak merespons. Periksa deployment Apps Script."));
    }, 20000);

    function bersihkan() {
      clearTimeout(timer);
      script.remove();
      delete window[callback];
    }

    window[callback] = function(data) {
      if (selesai) return;
      selesai = true;
      bersihkan();
      resolve(data);
    };

    const query = new URLSearchParams({
      ...parameter,
      callback: callback,
      waktu: Date.now().toString()
    });

    script.onerror = function() {
      if (selesai) return;
      selesai = true;
      bersihkan();
      reject(new Error("Gagal menghubungi Google Apps Script."));
    };

    script.src = API + "?" + query.toString();
    document.body.appendChild(script);
  });
}

async function muatBarang() {
  const pilihan = document.getElementById("cariBarang").value = "";

  pilihan.innerHTML =
    '<option value="">Memuat daftar barang...</option>';

  try {
    const hasil = await kirimJSONP({
      action: "items"
    });

    if (!hasil || !hasil.ok) {
      throw new Error(hasil.error || "Gagal mengambil daftar barang.");
    }

    daftarBarang = hasil.items || [];

    pilihan.innerHTML =
      '<option value="">-- Pilih Nama Barang --</option>';

    daftarBarang.forEach(function(item) {
      const option = document.createElement("option");
      option.value = item.barcode;
      option.textContent =
        item.nama + " | Kode: " + item.kode +
        " | Stok: " + item.stok;

      pilihan.appendChild(option);
    });

    if (daftarBarang.length === 0) {
      pilihan.innerHTML =
        '<option value="">Belum ada barang terdaftar</option>';
    }

    tampilStatus(
      "Daftar barang berhasil dimuat: " +
      daftarBarang.length + " barang."
    );

    tampilkanStok();

  } catch (err) {
    pilihan.innerHTML =
      '<option value="">Gagal memuat barang</option>';

    tampilStatus("ERROR:\n" + err.message);
  }
}

function tampilkanStok() {
  const barcode = document.getElementById("barang").value;
  const info = document.getElementById("stokInfo");

  const item = daftarBarang.find(function(x) {
    return x.barcode === barcode;
  });

  if (!item) {
    info.textContent = "Pilih barang untuk melihat stok.";
    return;
  }

  info.textContent =
    "Barang: " + item.nama +
    "\nKode: " + item.kode +
    "\nStok tersedia: " + item.stok;
}

async function simpanTransaksi() {
  const barcode = document.getElementById("barang").value;
  const jenis = document.getElementById("jenis").value;
  const jumlah = document.getElementById("jumlah").value;
  const petugas = document.getElementById("petugas").value.trim();
  const catatan = document.getElementById("catatan").value.trim();

  if (!barcode) {
    tampilStatus("Silakan pilih barang terlebih dahulu.");
    return;
  }

  if (!jumlah || Number(jumlah) <= 0 ||
      !Number.isInteger(Number(jumlah))) {
    tampilStatus("Jumlah harus berupa angka bulat lebih dari 0.");
    return;
  }

  if (!petugas) {
    tampilStatus("Nama petugas harus diisi.");
    return;
  }

  const tombol = document.getElementById("simpanBtn");
  tombol.disabled = true;
  tombol.textContent = "MENYIMPAN...";

  tampilStatus("Mengirim transaksi ke Google Sheets...");

  try {
    const hasil = await kirimJSONP({
      action: "record",
      barcode: barcode,
      jenis: jenis,
      jumlah: jumlah,
      petugas: petugas,
      catatan: catatan
    });

    if (hasil && hasil.ok) {
      tampilStatus(
        "TRANSAKSI BERHASIL!\n\n" +
        "Nama barang: " + hasil.nama +
        "\nKode barang: " + hasil.kode +
        "\nJenis: " + hasil.jenis +
        "\nJumlah: " + hasil.jumlah +
        "\nStok sekarang: " + hasil.stok
      );

      document.getElementById("jumlah").value = 1;
      document.getElementById("catatan").value = "";

      await muatBarang();

    } else {
      tampilStatus(
        "TRANSAKSI GAGAL:\n" +
        (hasil && hasil.error ? hasil.error : "Respons server tidak dikenal.")
      );
    }

  } catch (err) {
    tampilStatus("ERROR:\n" + err.message);

  } finally {
    tombol.disabled = false;
    tombol.textContent = "SIMPAN TRANSAKSI";
  }
}

document.getElementById("barang")
  .addEventListener("change", tampilkanStok);

muatBarang();
</script>

</body>
</html>
